name: Publish ViiOS demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify demo isolation
        run: node --test tests/demo-api.test.mjs tests/demo-build.test.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build isolated static demo
        id: build
        run: npm run demo:build
        env:
          VIIOS_DEMO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload static demo only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build.outputs.site_directory }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
